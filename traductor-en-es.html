<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Intérprete EN→ES</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header { padding: 14px 0 8px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; }
  button {
    border: 0; border-radius: 16px; padding: 20px 12px;
    font-size: 22px; font-weight: 700; color: #fff; font-family: inherit;
  }
  button:active { opacity: .8; }
  #btn { flex: 2; background: #e11d2e; }
  #btn.on { box-shadow: 0 0 0 4px #000, 0 0 0 7px #e11d2e; }
  #ask { flex: 1; background: #1d6fe0; }
  #ask.on { box-shadow: 0 0 0 4px #000, 0 0 0 7px #1d6fe0; }
  #status { font-size: 15px; color: #9aa4ae; min-height: 20px; text-align: center; }
  #error {
    display: none; background: #2a0b0e; border: 1px solid #e11d2e; color: #ffd6d6;
    border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.4;
  }
  #out {
    flex: 1; overflow-y: auto; padding: 8px 0 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .line {
    font-size: clamp(26px, 7.2vw, 42px); line-height: 1.25; font-weight: 600;
    color: #fff; overflow-wrap: anywhere;
  }
  .line.en { color: #7db4ff; }
  .line.old { color: #6b7480; font-weight: 500; font-size: clamp(20px, 5.4vw, 30px); }
  #hint { color: #6b7480; font-size: 18px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <button id="btn" type="button">Iniciar</button>
    <button id="ask" type="button">Preguntar</button>
  </div>
  <div id="status">Listo. Toca Iniciar.</div>
  <div id="error" role="alert"></div>
</header>
<main id="out" aria-live="polite">
  <div id="hint">Aquí aparecerá la traducción.</div>
</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const btn = $('btn'), askBtn = $('ask'), statusEl = $('status'), errEl = $('error'), out = $('out');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---- Ajustes ----
  const CHUNK_WORDS = 6;          // palabras mínimas por fragmento (sin cambios)
  const HOLD_WORDS = 2;           // últimas palabras que se retienen mientras son provisionales
  const SILENCE_FLUSH_MS = 600;   // si no llega nada nuevo, se traduce lo pendiente
  const LOW_CONF = 0.3;           // se descartan fragmentos finales con confianza menor
  const MAX_LINES = 14;

  // ---- Estado ----
  let running = false;
  let asking = false;
  let rec = null;
  let recActive = false;
  let restartTimer = null;
  let restartDelay = 150;
  let failCount = 0;
  let startedThisSession = false;
  let wakeLock = null;

  let committed = 0;
  let lastWords = [];
  let lastBad = [];
  let flushTimer = null;

  let orderChain = Promise.resolve();
  const speakQueue = [];
  let speaking = false;
  let esVoice = null, enVoice = null;
  let transientError = false;

  // ---- UI ----
  function setStatus(t) { statusEl.textContent = t; }
  function showError(t) { errEl.textContent = t; errEl.style.display = 'block'; }
  function clearError() { errEl.style.display = 'none'; errEl.textContent = ''; }
  function updateUI() {
    btn.textContent = running ? 'Detener' : 'Iniciar';
    btn.classList.toggle('on', running);
    askBtn.classList.toggle('on', asking);
  }

  function showLine(text, cls) {
    const hint = $('hint');
    if (hint) hint.remove();
    out.querySelectorAll('.line:not(.old)').forEach((n) => n.classList.add('old'));
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;           // siempre texto, nunca HTML
    out.appendChild(d);
    while (out.children.length > MAX_LINES) out.removeChild(out.firstChild);
    out.scrollTop = out.scrollHeight;
  }

  // ---- Filtros de idioma ----
  const ES_WORDS = new Set(['el','la','los','las','que','una','por','para','con','pero','muy','hola',
    'gracias','buenos','días','dias','qué','yo','tú','mi','su','del','al','lo','más','está','esto',
    'también','porque','cuando','donde','nosotros','ustedes','ellos','bueno','entonces','vale','es',
    'en','un','se','si','sí','como','cómo','ya','hay','esta','estoy','tengo','quiero','pues','bien']);
  const EN_WORDS = new Set(['the','a','an','and','or','but','is','are','was','were','be','been','am',
    'i','you','he','she','it','we','they','me','him','her','us','them','my','your','his','its','our','their',
    'to','of','in','on','at','for','with','from','by','about','as','into','this','that','these','those',
    'not','no','yes','do','does','did','have','has','had','will','would','can','could','should','may',
    'what','when','where','who','why','how','which','there','here','so','if','then','than','just','very',
    'okay','ok','thanks','thank','hello','hi','please','sorry','well','right','now','all','one','get','go']);

  function words(t) { return t.toLowerCase().replace(/[^a-záéíóúñü'\s]/g, ' ').split(/\s+/).filter(Boolean); }

  function looksSpanish(t) {
    if (/[¿¡áéíóúñü]/i.test(t)) return true;
    const w = words(t);
    let n = 0;
    for (const x of w) if (ES_WORDS.has(x)) n++;
    return n >= 2 || (w.length > 0 && n / w.length >= 0.3);
  }
  function looksEnglish(t) {
    const w = words(t);
    let n = 0;
    for (const x of w) if (EN_WORDS.has(x)) n++;
    return n >= 1 && n / Math.max(w.length, 1) >= 0.2;
  }

  // ---- Traducción (gratuita, sin clave) ----
  async function fetchJSON(url, ms) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(to); }
  }
  function okNet() { if (transientError) { clearError(); transientError = false; } }

  async function translate(text) {
    if (looksSpanish(text) || !looksEnglish(text)) return null;
    try {
      const d = await fetchJSON(
        'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=' +
        encodeURIComponent(text), 3500);
      if (d && d[2] && d[2] !== 'en') return null;      // no es inglés: no hacer nada
      const es = (d[0] || []).map((s) => s[0]).join('').trim();
      if (es) { okNet(); return es; }
    } catch (e) { /* pasa al respaldo */ }
    try {
      const d = await fetchJSON(
        'https://api.mymemory.translated.net/get?langpair=en|es&q=' + encodeURIComponent(text), 5000);
      const es = d && d.responseData && d.responseData.translatedText;
      if (es && d.responseStatus === 200) { okNet(); return String(es).trim(); }
    } catch (e) { /* sin servicio */ }
    showError('No se pudo traducir: revisa tu conexión a internet. Sigo escuchando.');
    transientError = true;
    return null;
  }

  async function translateToEnglish(text) {
    try {
      const d = await fetchJSON(
        'https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=' +
        encodeURIComponent(text), 5000);
      const en = (d[0] || []).map((s) => s[0]).join('').trim();
      if (en) { okNet(); return en; }
    } catch (e) {}
    try {
      const d = await fetchJSON(
        'https://api.mymemory.translated.net/get?langpair=es|en&q=' + encodeURIComponent(text), 6000);
      const en = d && d.responseData && d.responseData.translatedText;
      if (en && d.responseStatus === 200) { okNet(); return String(en).trim(); }
    } catch (e) {}
    showError('No se pudo traducir al inglés: revisa tu conexión a internet.');
    return null;
  }

  function enqueueChunk(text) {
    text = text.trim();
    if (!text) return;
    const p = translate(text);   // se traducen en paralelo...
    orderChain = orderChain      // ...pero se muestran y leen en orden
      .then(() => p)
      .then((es) => { if (es && running) { showLine(es); queueSpeech(es, 'es-ES'); } })
      .catch(() => {});
  }

  // ---- Voz (cola) ----
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    esVoice = vs.find((v) => /^es[-_]ES/i.test(v.lang)) || vs.find((v) => /^es/i.test(v.lang)) || null;
    enVoice = vs.find((v) => /^en[-_]GB/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = pickVoice;
    pickVoice();
  }

  function unlockSpeech() {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function queueSpeech(text, lang) {
    speakQueue.push({ text, lang });
    if (!speaking) playNext();
  }

  function playNext() {
    const it = speakQueue.shift();
    if (!it) { speaking = false; return; }
    speaking = true;
    const u = new SpeechSynthesisUtterance(it.text);
    u.lang = it.lang;
    const v = it.lang.startsWith('en') ? enVoice : esVoice;
    if (v) u.voice = v;
    const n = speakQueue.length;                 // con cola, habla más rápido
    u.rate = n >= 3 ? 1.5 : n >= 2 ? 1.35 : n >= 1 ? 1.25 : 1.15;
    let done = false;
    const next = () => { if (done) return; done = true; clearTimeout(guard); playNext(); };
    const guard = setTimeout(next, 3000 + it.text.length * 100);
    u.onend = next;
    u.onerror = next;
    try { speechSynthesis.speak(u); } catch (e) { next(); }
  }

  // ---- Reconocimiento de voz (inglés británico) ----
  function takeChunk(from, count) {
    const kept = [];
    for (let i = from; i < from + count; i++) {
      if (!lastBad[i]) kept.push(lastWords[i]);
    }
    if (kept.length >= 2 || (kept.length === 1 && count === 1)) enqueueChunk(kept.join(' '));
  }

  function flushAll() {
    clearTimeout(flushTimer);
    if (lastWords.length > committed) {
      takeChunk(committed, lastWords.length - committed);
      committed = lastWords.length;
    }
  }

  function onResult(ev) {
    const ws = [], bad = [];
    let allFinal = true;
    for (let i = 0; i < ev.results.length; i++) {
      const res = ev.results[i];
      const alt = res[0];
      const segWords = alt.transcript.trim().split(/\s+/).filter(Boolean);
      const lowConf = res.isFinal && alt.confidence > 0 && alt.confidence < LOW_CONF;
      for (const w of segWords) { ws.push(w); bad.push(lowConf); }
      if (!res.isFinal) allFinal = false;
    }
    lastWords = ws;
    lastBad = bad;
    if (ws.length < committed) committed = 0;   // la lista se reinició

    const pending = ws.length - committed;
    const stable = pending - (allFinal ? 0 : HOLD_WORDS);
    if (stable >= CHUNK_WORDS || (allFinal && pending > 0)) {
      const take = allFinal ? pending : stable;
      takeChunk(committed, take);
      committed += take;
    }
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushAll, SILENCE_FLUSH_MS);
  }

  function stopWithError(msg) {
    showError(msg);
    stop(true);
  }

  function onRecError(ev) {
    const e = ev && ev.error;
    if (e === 'not-allowed' || e === 'service-not-allowed') {
      let m = 'El navegador no dio permiso al micrófono. Toca el candado junto a la dirección → Permisos → Micrófono → Permitir, y vuelve a tocar Iniciar.';
      if (location.protocol === 'file:') {
        m += ' Estás abriendo el archivo directamente del teléfono: ábrelo desde la dirección https de GitHub Pages.';
      }
      stopWithError(m);
    } else if (e === 'audio-capture') {
      stopWithError('No se detecta ningún micrófono. Revisa que los auriculares estén conectados y que ninguna otra app use el micrófono.');
    } else if (e === 'language-not-supported') {
      stopWithError('Este navegador no admite reconocimiento de voz en inglés británico (en-GB).');
    } else if (e === 'network') {
      showError('El reconocimiento de voz no tiene conexión a internet. Reintentando…');
      restartDelay = Math.min(restartDelay * 2, 4000);
    }
    // 'no-speech' y 'aborted' son normales: onend reinicia solo
  }

  function scheduleRestart() {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => { restartTimer = null; startRecognition(); }, restartDelay);
  }

  function startRecognition() {
    if (!running || asking) return;
    clearTimeout(restartTimer);
    restartTimer = null;
    const r = new SR();
    r.lang = 'en-GB';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    committed = 0;
    lastWords = [];
    lastBad = [];
    startedThisSession = false;

    r.onstart = () => {
      if (rec !== r) return;
      recActive = true; startedThisSession = true; failCount = 0; restartDelay = 150;
      if (errEl.textContent.indexOf('reconocimiento de voz') !== -1) clearError();
      setStatus('Escuchando inglés…');
    };
    r.onresult = (ev) => { if (rec === r) onResult(ev); };
    r.onerror = (ev) => { if (rec === r) onRecError(ev); };
    r.onend = () => {
      if (rec !== r) return;
      recActive = false;
      flushAll();
      if (!running || asking) return;
      if (!startedThisSession) {
        failCount++;
        if (failCount >= 5) {
          stopWithError('El reconocimiento de voz no logra arrancar. Cierra otras apps que usen el micrófono, comprueba el permiso y vuelve a intentarlo.');
          return;
        }
        restartDelay = Math.min(restartDelay * 2, 3000);
      }
      scheduleRestart();
    };

    rec = r;
    try {
      r.start();
    } catch (e) {
      if (e && e.name === 'InvalidStateError') { scheduleRestart(); return; }
      stopWithError('No se pudo iniciar el micrófono: ' + (e && e.message ? e.message : e));
    }
  }

  // ---- Botón Preguntar: «cómo se dice …» (español → inglés, solo con el botón) ----
  function handleAsk(raw) {
    const t = raw.toLowerCase().replace(/[¿?¡!.,;:]/g, ' ').replace(/\s+/g, ' ').trim();
    const m = t.match(/c[oó]mo se dice\s+(?:en ingl[eé]s\s+)?(.+)$/);
    if (!m) {
      showError('No oí «cómo se dice…». Toca Preguntar y di, por ejemplo: «cómo se dice perro».');
      return;
    }
    const phrase = m[1].trim();
    setStatus('Traduciendo…');
    translateToEnglish(phrase).then((en) => {
      if (!en) return;
      showLine(en, 'en');
      queueSpeech(en, 'en-GB');
    });
  }

  function ask() {
    if (!SR) { showError('Este navegador no admite reconocimiento de voz. Abre la página en Chrome para Android.'); return; }
    if (asking) return;
    if (!running) { showError('Primero toca Iniciar.'); return; }
    clearError();
    asking = true;
    updateUI();
    setStatus('Di: «cómo se dice…»');
    flushAll();
    clearTimeout(restartTimer); restartTimer = null;
    const old = rec; rec = null; recActive = false;
    try { if (old) old.abort(); } catch (e) {}

    const a = new SR();
    a.lang = 'es-ES';
    a.continuous = false;
    a.interimResults = false;
    a.maxAlternatives = 1;
    let got = false;
    a.onresult = (ev) => {
      got = true;
      handleAsk(ev.results[0][0].transcript);
    };
    a.onerror = (ev) => {
      const e = ev && ev.error;
      if (e === 'not-allowed' || e === 'service-not-allowed') showError('Sin permiso de micrófono para preguntar. Revisa el candado junto a la dirección.');
      else if (e === 'network') showError('Sin conexión a internet para reconocer tu pregunta.');
    };
    a.onend = () => {
      asking = false;
      updateUI();
      if (!got && !errEl.textContent) showError('No te oí. Toca Preguntar y habla justo después.');
      if (running) { setStatus('Escuchando inglés…'); startRecognition(); }
    };
    try { a.start(); }
    catch (e) { a.onend(); }
    // por si el reconocedor no cierra solo
    setTimeout(() => { try { a.stop(); } catch (e) {} }, 9000);
  }

  // ---- Pantalla activa ----
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && running && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* no crítico */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      if (!wakeLock) requestWakeLock();
      if (!recActive && !restartTimer && !asking) startRecognition();
    }
  });

  // Vigilante: si el reconocimiento se queda parado, lo reinicia
  setInterval(() => {
    if (running && !asking && !recActive && !restartTimer && document.visibilityState === 'visible') startRecognition();
  }, 4000);

  // ---- Iniciar / Detener ----
  function start() {
    clearError();
    if (!SR) {
      showError('Este navegador no admite reconocimiento de voz. Abre la página en Chrome para Android.');
      return;
    }
    if (!window.isSecureContext) {
      showError('La página debe abrirse desde una dirección https para poder usar el micrófono.');
      return;
    }
    if (!('speechSynthesis' in window)) {
      showError('Este navegador no puede leer en voz alta. Abre la página en Chrome para Android.');
      return;
    }
    running = true;
    failCount = 0; restartDelay = 150;
    updateUI();
    setStatus('Iniciando micrófono…');
    unlockSpeech();                 // debe ocurrir dentro del toque del usuario
    startRecognition();
    requestWakeLock();
    const vs = speechSynthesis.getVoices();
    if (vs.length && !vs.some((v) => /^es/i.test(v.lang))) {
      showError('No hay voz en español instalada en el teléfono; se usará la voz predeterminada.');
    }
  }

  function stop(keepError) {
    running = false; asking = false;
    clearTimeout(restartTimer); restartTimer = null;
    clearTimeout(flushTimer);
    const r = rec; rec = null; recActive = false;
    try { if (r) r.abort(); } catch (e) {}
    speakQueue.length = 0; speaking = false;
    try { speechSynthesis.cancel(); } catch (e) {}
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
    updateUI();
    setStatus('Detenido.');
    if (!keepError) clearError();
  }

  btn.addEventListener('click', () => { running ? stop() : start(); });
  askBtn.addEventListener('click', ask);
  updateUI();
})();
</script>
</body>
</html>
